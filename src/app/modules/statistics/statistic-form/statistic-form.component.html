<div class="mx-auto max-w-2xl rounded-lg bg-white p-6 shadow">
  <h1 class="mb-6 text-2xl font-semibold text-gray-800">Nueva estadística</h1>

  <form [formGroup]="form" (ngSubmit)="submit()" class="grid gap-2">
    <mat-form-field appearance="outline">
      <mat-label>Título</mat-label>
      <input matInput formControlName="title" maxlength="120" />
      <mat-error *ngIf="form.controls['title'].hasError('required')">El título es obligatorio</mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Tipo de gráfica</mat-label>
      <mat-select formControlName="chartType">
        <mat-option *ngFor="let type of chartTypes" [value]="type.value">{{ type.label }}</mat-option>
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Modelo</mat-label>
      <mat-select formControlName="source" (selectionChange)="onSourceChange($event.value)">
        <mat-option *ngFor="let source of sources" [value]="source.value">{{ source.label }}</mat-option>
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Dato a comparar</mat-label>
      <mat-select formControlName="compareBy">
        <mat-option *ngFor="let option of compareOptions" [value]="option.value">{{ option.label }}</mat-option>
      </mat-select>
    </mat-form-field>

    <div class="grid gap-4 sm:grid-cols-2">
      <mat-form-field appearance="outline">
        <mat-label>Fecha desde</mat-label>
        <input matInput type="date" formControlName="dateFrom" />
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Fecha hasta</mat-label>
        <input matInput type="date" formControlName="dateTo" />
      </mat-form-field>
    </div>
    <p *ngIf="form.hasError('dateRange') && form.touched" class="text-sm text-red-600">
      La fecha "hasta" no puede ser anterior a la fecha "desde".
    </p>
    <p class="text-xs text-gray-500">Las fechas son opcionales y el rango incluye ambos días.</p>

    <div class="mt-4 flex justify-end gap-3">
      <a mat-button routerLink="/statistics">Cancelar</a>
      <button mat-flat-button color="primary" type="submit" [disabled]="loading">Crear estadística</button>
    </div>
  </form>
</div>
