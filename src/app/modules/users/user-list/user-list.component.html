<div class="mb-4 flex flex-wrap items-center justify-between gap-4">
  <h1 class="text-2xl font-semibold text-gray-800">Usuarios</h1>
  <a mat-flat-button color="primary" routerLink="/users/new">Nuevo usuario</a>
</div>

<form [formGroup]="filterForm" (ngSubmit)="applyFilters()" class="mb-4 flex flex-wrap items-center gap-3">
  <mat-form-field appearance="outline" class="w-56">
    <mat-label>Nombre</mat-label>
    <input matInput formControlName="name" />
    <mat-hint>Coincidencia exacta</mat-hint>
  </mat-form-field>

  <mat-form-field appearance="outline" class="w-56">
    <mat-label>Rol</mat-label>
    <mat-select formControlName="role">
      <mat-option *ngFor="let role of roles" [value]="role.value">{{ role.label }}</mat-option>
    </mat-select>
  </mat-form-field>

  <button mat-stroked-button type="submit">Buscar</button>
  <button mat-button type="button" (click)="clearFilters()">Limpiar</button>
</form>

<div class="relative rounded-lg bg-white shadow">
  <mat-spinner *ngIf="loading" diameter="36" class="absolute inset-0 m-auto"></mat-spinner>

  <table mat-table [dataSource]="users" class="w-full">
    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef>Nombre</th>
      <td mat-cell *matCellDef="let user">{{ user.name }}</td>
    </ng-container>

    <ng-container matColumnDef="email">
      <th mat-header-cell *matHeaderCellDef>Email</th>
      <td mat-cell *matCellDef="let user">{{ user.email }}</td>
    </ng-container>

    <ng-container matColumnDef="role">
      <th mat-header-cell *matHeaderCellDef>Rol</th>
      <td mat-cell *matCellDef="let user">{{ user.role === 'admin' ? 'Administrador' : 'Usuario' }}</td>
    </ng-container>

    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef></th>
      <td mat-cell *matCellDef="let user" class="text-right">
        <a mat-icon-button [routerLink]="['/users', user.id, 'edit']" aria-label="Editar">
          <mat-icon>edit</mat-icon>
        </a>
        <button
          *ngIf="!isCurrentUser(user)"
          mat-icon-button
          color="warn"
          type="button"
          (click)="confirmDelete(user)"
          aria-label="Eliminar">
          <mat-icon>delete</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
  </table>

  <p *ngIf="!loading && users.length === 0" class="p-6 text-center text-gray-500">No hay usuarios.</p>

  <mat-paginator
    [length]="totalResults"
    [pageIndex]="page - 1"
    [pageSize]="pageSize"
    [pageSizeOptions]="pageSizeOptions"
    (page)="onPage($event)"
    showFirstLastButtons>
  </mat-paginator>
</div>
