<div class="mb-4 flex flex-wrap items-center justify-between gap-4">
  <h1 class="text-2xl font-semibold text-gray-800">Productos</h1>
  <a *ngIf="auth.isAdmin" mat-flat-button color="primary" routerLink="/products/new">Nuevo producto</a>
</div>

<form [formGroup]="filterForm" (ngSubmit)="applyFilters()" class="mb-4 flex flex-wrap items-center gap-3">
  <mat-form-field appearance="outline" class="w-56">
    <mat-label>Nombre</mat-label>
    <input matInput formControlName="name" />
    <mat-hint>Coincidencia exacta</mat-hint>
  </mat-form-field>

  <mat-form-field appearance="outline" class="w-56">
    <mat-label>Categoría</mat-label>
    <input matInput formControlName="category" />
    <mat-hint>Coincidencia exacta</mat-hint>
  </mat-form-field>

  <button mat-stroked-button type="submit">Buscar</button>
  <button mat-button type="button" (click)="clearFilters()">Limpiar</button>
</form>

<div class="relative rounded-lg bg-white shadow">
  <mat-spinner *ngIf="loading" diameter="36" class="absolute inset-0 m-auto"></mat-spinner>

  <table mat-table [dataSource]="products" class="w-full">
    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef>Nombre</th>
      <td mat-cell *matCellDef="let product">{{ product.name }}</td>
    </ng-container>

    <ng-container matColumnDef="category">
      <th mat-header-cell *matHeaderCellDef>Categoría</th>
      <td mat-cell *matCellDef="let product">{{ product.category }}</td>
    </ng-container>

    <ng-container matColumnDef="price">
      <th mat-header-cell *matHeaderCellDef>Precio</th>
      <td mat-cell *matCellDef="let product">{{ product.price | number: '1.2-2' }}</td>
    </ng-container>

    <ng-container matColumnDef="stock">
      <th mat-header-cell *matHeaderCellDef>Stock</th>
      <td mat-cell *matCellDef="let product">{{ product.stock }}</td>
    </ng-container>

    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef></th>
      <td mat-cell *matCellDef="let product" class="text-right">
        <ng-container *ngIf="auth.isAdmin">
          <a mat-icon-button [routerLink]="['/products', product.id, 'edit']" aria-label="Editar">
            <mat-icon>edit</mat-icon>
          </a>
          <button mat-icon-button color="warn" type="button" (click)="confirmDelete(product)" aria-label="Eliminar">
            <mat-icon>delete</mat-icon>
          </button>
        </ng-container>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
  </table>

  <p *ngIf="!loading && products.length === 0" class="p-6 text-center text-gray-500">No hay productos.</p>

  <mat-paginator
    [length]="totalResults"
    [pageIndex]="page - 1"
    [pageSize]="pageSize"
    [pageSizeOptions]="pageSizeOptions"
    (page)="onPage($event)"
    showFirstLastButtons>
  </mat-paginator>
</div>
