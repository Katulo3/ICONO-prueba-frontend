<div class="flex min-h-screen items-center justify-center bg-gray-100 px-4">
  <mat-card class="w-full max-w-md p-6">
    <mat-card-title class="!text-2xl">Iniciar sesión</mat-card-title>
    <mat-card-subtitle>Accede a tu cuenta</mat-card-subtitle>

    <mat-card-content class="mt-4">
      <form [formGroup]="form" (ngSubmit)="submit()" class="flex flex-col">
        <mat-form-field appearance="outline">
          <mat-label>Correo electrónico</mat-label>
          <input matInput type="email" formControlName="email" autocomplete="username" />
          <mat-error *ngIf="form.controls['email'].hasError('required')">El correo es obligatorio</mat-error>
          <mat-error *ngIf="form.controls['email'].hasError('email')">Correo no válido</mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Contraseña</mat-label>
          <input matInput type="password" formControlName="password" autocomplete="current-password" />
          <mat-error *ngIf="form.controls['password'].hasError('required')">La contraseña es obligatoria</mat-error>
        </mat-form-field>

        <p *ngIf="errorMessage" class="mb-3 rounded-md bg-red-50 px-3 py-2 text-sm text-red-700">{{ errorMessage }}</p>

        <button mat-flat-button color="primary" type="submit" [disabled]="form.invalid || loading">
          {{ loading ? 'Entrando...' : 'Entrar' }}
        </button>
      </form>
    </mat-card-content>

    <mat-card-actions align="end">
      <a mat-button routerLink="/auth/register">Crear cuenta</a>
    </mat-card-actions>
  </mat-card>
</div>
