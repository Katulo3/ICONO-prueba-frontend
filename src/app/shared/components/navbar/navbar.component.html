<mat-toolbar color="primary" *ngIf="auth.user$ | async as user" class="sticky top-0 z-10 shadow">
  <span class="font-semibold">E-sueldos</span>

  <nav class="ml-6 flex gap-2">
    <a mat-button routerLink="/products" routerLinkActive="bg-white/20">Productos</a>
    <a *ngIf="user.role === 'admin'" mat-button routerLink="/users" routerLinkActive="bg-white/20">Usuarios</a>
  </nav>

  <span class="flex-1"></span>

  <span class="mr-4 text-sm">{{ user.name }} ({{ user.role }})</span>
  <button mat-stroked-button type="button" (click)="logout()">Cerrar sesión</button>
</mat-toolbar>
